<svg width="1200" height="540" viewBox="0 0 1200 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0117"/>
      <stop offset="55%" stop-color="#180a2e"/>
      <stop offset="100%" stop-color="#230f3d"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: 'Courier New', monospace; }
      .sans { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="540" fill="url(#bg)"/>
  <rect x="6" y="6" width="1188" height="528" rx="18" fill="none" stroke="url(#border)" stroke-width="2"/>

  <!-- decorative sparkles -->
  <g fill="#f472b6" opacity="0.7">
    <circle cx="1080" cy="60" r="3"/>
    <circle cx="1120" cy="120" r="2"/>
    <circle cx="150" cy="50" r="2.5"/>
    <circle cx="90" cy="410" r="2"/>
  </g>

  <!-- left: intro -->
  <text x="60" y="90" class="mono" font-size="20" fill="#a78bfa">pranjal@data-analyst:~$ cat about.md</text>

  <text x="60" y="140" class="sans" font-size="30" fill="#e5e7eb">Hi, I'm 👋</text>
  <text x="60" y="185" class="sans" font-size="46" font-weight="700" fill="url(#nameGrad)">Pranjal Waim 📊</text>

  <text x="60" y="225" class="mono" font-size="18" fill="#9ca3af">&lt; Data Analyst · Power BI · SQL · Python /&gt;</text>

  <rect x="60" y="245" width="520" height="70" rx="10" fill="#1b0f2e" stroke="#7c3aed" stroke-opacity="0.5"/>
  <text x="78" y="272" class="sans" font-size="15" fill="#e879f9">I don't just look at data,</text>
  <text x="78" y="296" class="sans" font-size="15" fill="#e879f9">I turn it into decisions. 💜</text>

  <text x="60" y="345" class="sans" font-size="16" fill="#f472b6">🛠 Tech I Know</text>
  <g class="sans" font-size="13" font-weight="600">
    <rect x="60" y="355" width="72" height="26" rx="13" fill="#3b0f2b" stroke="#f472b6"/>
    <text x="96" y="372" fill="#f9a8d4" text-anchor="middle">Power BI</text>

    <rect x="140" y="355" width="52" height="26" rx="13" fill="#0f1f3b" stroke="#60a5fa"/>
    <text x="166" y="372" fill="#93c5fd" text-anchor="middle">SQL</text>

    <rect x="200" y="355" width="64" height="26" rx="13" fill="#1f2937" stroke="#facc15"/>
    <text x="232" y="372" fill="#fde047" text-anchor="middle">Python</text>

    <rect x="272" y="355" width="52" height="26" rx="13" fill="#0f2f2a" stroke="#34d399"/>
    <text x="298" y="372" fill="#6ee7b7" text-anchor="middle">DAX</text>

    <rect x="332" y="355" width="60" height="26" rx="13" fill="#1e123b" stroke="#a78bfa"/>
    <text x="362" y="372" fill="#c4b5fd" text-anchor="middle">Excel</text>
  </g>

  <!-- stats row -->
  <line x1="60" y1="400" x2="580" y2="400" stroke="#3f2a5c" stroke-width="1"/>
  <g class="sans" text-anchor="middle">
    <text x="105" y="428" font-size="20" font-weight="700" fill="#f9a8d4">4+</text>
    <text x="105" y="448" font-size="12" fill="#9ca3af">Projects</text>

    <text x="230" y="428" font-size="20" font-weight="700" fill="#c4b5fd">10K+</text>
    <text x="230" y="448" font-size="12" fill="#9ca3af">Records Analyzed</text>

    <text x="365" y="428" font-size="20" font-weight="700" fill="#93c5fd">1</text>
    <text x="365" y="448" font-size="12" fill="#9ca3af">Internship</text>

    <text x="490" y="428" font-size="20" font-weight="700" fill="#6ee7b7">PL-300</text>
    <text x="490" y="448" font-size="12" fill="#9ca3af">In Progress</text>
  </g>

  <!-- right: terminal window -->
  <g filter="url(#glow)">
    <rect x="660" y="60" width="480" height="300" rx="14" fill="#120a24" stroke="#a855f7" stroke-opacity="0.6"/>
  </g>
  <rect x="660" y="60" width="480" height="34" rx="14" fill="#1b0f30"/>
  <circle cx="682" cy="77" r="6" fill="#f87171"/>
  <circle cx="702" cy="77" r="6" fill="#fbbf24"/>
  <circle cx="722" cy="77" r="6" fill="#34d399"/>
  <text x="900" y="82" class="mono" font-size="13" fill="#9ca3af" text-anchor="middle">dashboard.py</text>

  <g class="mono" font-size="14">
    <text x="680" y="120" fill="#c4b5fd">def</text>
    <text x="712" y="120" fill="#93c5fd">build_insights</text>
    <text x="820" y="120" fill="#e5e7eb">(data):</text>

    <text x="700" y="148" fill="#e5e7eb">clean = </text>
    <text x="768" y="148" fill="#93c5fd">clean_data</text>
    <text x="850" y="148" fill="#e5e7eb">(data)</text>

    <text x="700" y="176" fill="#e5e7eb">model = </text>
    <text x="768" y="176" fill="#93c5fd">build_dax</text>
    <text x="845" y="176" fill="#e5e7eb">(clean)</text>

    <text x="700" y="204" fill="#e5e7eb">dashboard = </text>
    <text x="798" y="204" fill="#93c5fd">visualize</text>
    <text x="868" y="204" fill="#e5e7eb">(model)</text>

    <text x="700" y="232" fill="#f472b6">return</text>
    <text x="762" y="232" fill="#e5e7eb">dashboard</text>

    <text x="680" y="260" fill="#c4b5fd"># turning raw data</text>
    <text x="680" y="278" fill="#c4b5fd"># into business decisions</text>
  </g>

  <rect x="700" y="300" width="400" height="46" rx="10" fill="#1b0f2e" stroke="#f472b6"/>
  <text x="900" y="320" class="sans" font-size="13" fill="#f9a8d4" text-anchor="middle" font-weight="600">KEEP ANALYZING</text>
  <text x="900" y="337" class="sans" font-size="13" fill="#c4b5fd" text-anchor="middle" font-weight="600">KEEP GROWING</text>

  <!-- bottom tagline -->
  <line x1="60" y1="495" x2="1140" y2="495" stroke="#3f2a5c" stroke-width="1"/>
  <text x="600" y="522" class="sans" font-size="14" fill="#6b7280" text-anchor="middle" font-style="italic">"Open to Data Analyst roles in Mumbai, Pune, Bengaluru — let's connect"</text>
</svg>
